<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Nightjar — a nightjar in flight inside a shield, over a verification check</title>
  <defs>
    <linearGradient id="nj" x1="92" y1="150" x2="420" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c8ff72"/>
      <stop offset="0.45" stop-color="#6ef0c2"/>
      <stop offset="1" stop-color="#7cc4ff"/>
    </linearGradient>
    <linearGradient id="nj-soft" x1="160" y1="180" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e6ffb8"/>
      <stop offset="0.5" stop-color="#9ff7d8"/>
      <stop offset="1" stop-color="#b6dcff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.58">
      <stop stop-color="#6ef0c2" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#6ef0c2" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#6ef0c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.78" cy="0.82" r="0.5">
      <stop stop-color="#b9a0ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#b9a0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="spark" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#05070c"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect width="512" height="512" rx="112" fill="url(#violet)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#1c2636" stroke-opacity="0.7"/>

  <!-- the shield: the same hexagonal frame the app mark uses -->
  <path d="M256 46 442 154v204L256 466 70 358V154Z" fill="none" stroke="url(#nj)" stroke-opacity="0.3" stroke-width="1.6"/>
  <path d="M256 66 424 164v184L256 446 88 348V164Z" fill="none" stroke="url(#nj)" stroke-opacity="0.1" stroke-width="1"/>

  <!-- the flight path is a check: verification is the product -->
  <path d="M138 296 218 374 388 190" fill="none" stroke="url(#nj)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.13"/>

  <g fill="#c8ff72">
    <circle cx="112" cy="128" r="2.2" opacity="0.8"/>
    <circle cx="402" cy="112" r="1.6" opacity="0.55"/>
    <circle cx="430" cy="300" r="1.8" opacity="0.5"/>
    <circle cx="104" cy="330" r="1.4" opacity="0.45"/>
    <circle cx="360" cy="420" r="1.6" opacity="0.4"/>
    <circle cx="170" cy="92" r="1.2" opacity="0.5"/>
    <circle cx="318" cy="86" r="1.1" opacity="0.4"/>
  </g>

  <!-- a soft duplicate makes the bird glow without a raster shadow -->
  <g filter="url(#blur)" opacity="0.5">
    <path d="M246 252C198 226 146 194 94 152l38 66-20-8 46 44-20-2 58 44 26 12Z" fill="url(#nj)"/>
    <path d="M266 252c48-26 100-58 152-100l-38 66 20-8-46 44 20-2-58 44-26 12Z" fill="url(#nj)"/>
    <path d="M256 204c22 4 34 26 32 50-2 34-14 66-32 100-18-34-30-66-32-100-2-24 10-46 32-50Z" fill="url(#nj)"/>
    <path d="M256 344l-28 60 24-18 4 22 4-22 24 18Z" fill="url(#nj)"/>
  </g>

  <g>
    <!-- left wing, swept and notched -->
    <path d="M246 252C198 226 146 194 94 152l38 66-20-8 46 44-20-2 58 44 26 12Z" fill="url(#nj)"/>
    <!-- right wing -->
    <path d="M266 252c48-26 100-58 152-100l-38 66 20-8-46 44 20-2-58 44-26 12Z" fill="url(#nj)"/>
    <!-- body -->
    <path d="M256 204c22 4 34 26 32 50-2 34-14 66-32 100-18-34-30-66-32-100-2-24 10-46 32-50Z" fill="url(#nj)"/>
    <!-- forked tail -->
    <path d="M256 344l-28 60 24-18 4 22 4-22 24 18Z" fill="url(#nj)"/>

    <!-- feather facets -->
    <path d="M246 252 190 206l24 74Z" fill="#ffffff" opacity="0.08"/>
    <path d="M266 252l56-46-24 74Z" fill="#ffffff" opacity="0.08"/>
    <path d="M256 214v122" stroke="#05070c" stroke-opacity="0.28" stroke-width="1.4"/>

    <!-- head and beak -->
    <circle cx="256" cy="202" r="21" fill="url(#nj-soft)"/>
    <path d="M249 218 263 218 256 230Z" fill="#c8ff72"/>
    <circle cx="248" cy="200" r="3.6" fill="#05070c"/>
    <circle cx="264" cy="200" r="3.6" fill="#05070c"/>
    <circle cx="249" cy="199" r="1.1" fill="#e6ffb8"/>
    <circle cx="265" cy="199" r="1.1" fill="#e6ffb8"/>
  </g>

  <!-- wingtip beacons: the two facts that close the loop -->
  <circle cx="94" cy="152" r="10" fill="#c8ff72" filter="url(#spark)" opacity="0.7"/>
  <circle cx="94" cy="152" r="4" fill="#c8ff72"/>
  <circle cx="418" cy="152" r="8" fill="#7cc4ff" filter="url(#spark)" opacity="0.7"/>
  <circle cx="418" cy="152" r="3.2" fill="#7cc4ff"/>
</svg>
