version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Nightjar pins exact versions of its runtime stack; grouping keeps a weekly
      # batch to one PR that can be reviewed and tested as a unit.
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(web)"
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(ci)"

  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(image)"
    ignore:
      # The images run the interpreter and the Node version that CI tests and the
      # development toolchain uses (`.github/workflows/ci.yml`, `.tools/`, README).
      # Moving a runtime line is a deliberate change that has to update pyproject,
      # the CI matrix, and the local toolchain together, so a base-image major bump
      # is not a dependency update a bot can make on its own. Patch and minor
      # updates - the ones that carry fixes - still arrive weekly.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
