name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Publish the current commit without a tag (must already be on main)"
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  build:
    name: build, check, and smoke-test the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match pyproject version $version" >&2
            exit 1
          fi

      - name: A manual run must name the version it publishes
        if: github.event_name == 'workflow_dispatch'
        run: |
          version="$(uv run --no-project python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "${{ inputs.confirm }}" != "$version" ]; then
            echo "confirm '${{ inputs.confirm }}' does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check the metadata renders
        run: uv run --no-project --with twine twine check dist/*

      - name: Install the wheel from an empty environment
        run: |
          uv venv --python 3.14 .smoke
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/nightjarctl --version
          .smoke/bin/nightjar-lab --help >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: the workflow exchanges the job's OIDC token for a
    # short-lived PyPI credential, so no API token lives in this repository.
    environment:
      name: pypi
      url: https://pypi.org/p/nightjar-ir
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
