name: dco

on:
  pull_request:
    branches: [main]

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sign-off:
    name: sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole point is the commits in the pull request, so a shallow clone
          # would check the merge commit and nothing else.
          fetch-depth: 0

      - name: Every commit carries a sign-off from its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            author="$(git show -s --format='%ae' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"
            trailers="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            if ! printf '%s\n' "$trailers" | grep -qiF "<$author>"; then
              printf '✗ %s %s\n    author: %s\n    no "Signed-off-by:" trailer with that address\n' \
                "$(git show -s --format='%h' "$sha")" "$subject" "$author"
              status=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")

          if [ "$status" -ne 0 ]; then
            cat <<'MSG'

          Nightjar uses the Developer Certificate of Origin. Sign your commits with
          `git commit -s`, or amend the ones you already made:

              git rebase --signoff HEAD~<count>
              git push --force-with-lease

          The sign-off must use the address that authored the commit.
          MSG
          fi
          exit "$status"
