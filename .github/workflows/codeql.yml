name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a quiet repository still gets new queries and new dataflow models.
    - cron: "31 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          # security-extended adds the checks that are still precise enough to gate
          # a merge; security-and-quality is too noisy for a repository this size.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
