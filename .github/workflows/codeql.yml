name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a quiet repository still gets new queries and new dataflow models.
    - cron: "31 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  # The analyze action reads the triggering workflow run when it uploads results.
  # Without this, a GHAS-enabled repository still fails the upload with 403.
  actions: read
  packages: read

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # SARIF upload needs a public repository or GitHub Advanced Security. Nightjar is
    # public, so this gates every push and pull request. The guard stays for mirrors
    # and private forks, which would otherwise fail on a permissions error; set the
    # NIGHTJAR_CODE_SCANNING repository variable to "true" to gate there as well.
    if: github.event.repository.private == false || vars.NIGHTJAR_CODE_SCANNING == 'true'
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}
          # security-extended adds the checks that are still precise enough to gate
          # a merge; security-and-quality is too noisy for a repository this size.
          queries: security-extended

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: /language:${{ matrix.language }}
