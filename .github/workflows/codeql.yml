name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a quiet repository still gets new queries and new dataflow models.
    - cron: "31 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  # The analyze action reads the triggering workflow run when it uploads results.
  # Without this, a GHAS-enabled repository still fails the upload with 403.
  actions: read
  packages: read

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # SARIF upload needs either a public repository or GitHub Advanced Security.
    # Nightjar is private until 0.1, and a job that fails on a permissions error
    # every push teaches people to ignore the check. The workflow starts gating the
    # moment the repository is public; set the NIGHTJAR_CODE_SCANNING repository
    # variable to "true" to opt in earlier on a GHAS-enabled private repository.
    if: github.event.repository.private == false || vars.NIGHTJAR_CODE_SCANNING == 'true'
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          # security-extended adds the checks that are still precise enough to gate
          # a merge; security-and-quality is too noisy for a repository this size.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
