name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  python:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nightjar
          POSTGRES_PASSWORD: nightjar
          POSTGRES_DB: nightjar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightjar -d nightjar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NIGHTJAR_TEST_DATABASE_URL: postgresql+asyncpg://nightjar:nightjar@127.0.0.1:5432/nightjar_test
      NIGHTJAR_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the distribution
        run: uv build

      - name: Check the metadata renders
        run: uv run --no-project --with twine twine check dist/*

      - name: Install the wheel into an empty environment
        run: |
          uv venv --python 3.14 .smoke
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/nightjarctl --version

  policy:
    name: policy parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPA_VERSION: v1.22.2
    steps:
      - uses: actions/checkout@v7

      - name: Install OPA
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x "$HOME/.local/bin/opa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --extra dev

      - name: Rego tests
        run: opa test policies/ -v

      - name: Local/Rego parity
        run: uv run pytest tests/test_policy.py -q

  backup:
    name: backup and restore
    # Pinned to 24.04 rather than ubuntu-latest because this job installs the
    # PostgreSQL 18 client from PGDG, and PGDG publishes for LTS releases. The
    # client must match the server major: an older pg_dump refuses a newer server.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nightjar
          POSTGRES_PASSWORD: nightjar
          POSTGRES_DB: nightjar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightjar -d nightjar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NIGHTJAR_TEST_DATABASE_URL: postgresql+asyncpg://nightjar:nightjar@127.0.0.1:5432/nightjar_test
      NIGHTJAR_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          # The armored key is used as-is: dearmoring needs a tty here, and
          # apt accepts an ASCII-armored key in signed-by directly.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --extra dev

      - name: Restore drill
        run: uv run pytest tests/test_backup_restore.py tests/test_ledger_cli.py -q

  evals:
    name: CornerShop evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nightjar
          POSTGRES_PASSWORD: nightjar
          POSTGRES_DB: nightjar_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightjar -d nightjar_eval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NIGHTJAR_EVAL_DATABASE_URL: postgresql+asyncpg://nightjar:nightjar@127.0.0.1:5432/nightjar_eval
      NIGHTJAR_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --extra dev

      - name: Run all suites with gates
        run: uv run nightjar-eval --suite all --output-dir "$RUNNER_TEMP/evals"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightjar-eval-report
          path: ${{ runner.temp }}/evals
          if-no-files-found: warn
          retention-days: 14

  web:
    name: web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: web smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nightjar
          POSTGRES_PASSWORD: nightjar
          POSTGRES_DB: nightjar_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nightjar -d nightjar_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NIGHTJAR_DATABASE_URL: postgresql+asyncpg://nightjar:nightjar@127.0.0.1:5432/nightjar_e2e
      NIGHTJAR_ENVIRONMENT: test
      NIGHTJAR_CORS_ORIGINS: http://127.0.0.1:3000
      NIGHTJAR_STABILITY_SECONDS: "10"
      NIGHTJAR_ALLOW_PRIVATE_PROBES: "true"
      NIGHTJAR_LAB_ENABLED: "true"
      NIGHTJAR_LAB_BASE_URL: http://127.0.0.1:8100
      NIGHTJAR_MODEL_PROVIDER: mock
      NIGHTJAR_CRITIC_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install API
        run: uv sync --extra dev

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Start lab and API
        run: |
          nohup uv run nightjar-lab --host 127.0.0.1 --port 8100 > "$RUNNER_TEMP/lab.log" 2>&1 &
          nohup uv run nightjar-api > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8100/healthz >/dev/null \
              && curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "services did not become healthy"
          tail -40 "$RUNNER_TEMP/lab.log" "$RUNNER_TEMP/api.log"
          exit 1

      - name: Capability doctor
        run: uv run nightjarctl doctor --json
        env:
          NIGHTJAR_LAB_BASE_URL: http://127.0.0.1:8100

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start standalone server
        working-directory: apps/web
        run: |
          cp -r .next/static .next/standalone/.next/static
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -40 "$RUNNER_TEMP/web.log"
          exit 1

      - name: Smoke test
        working-directory: apps/web
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightjar-playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: nightjar:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: false
          tags: nightjar-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  compose:
    name: compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the stack
        working-directory: deploy/compose
        run: docker compose build api lab migrate

      - name: Start it
        working-directory: deploy/compose
        # No --wait: the migration service exits on purpose, and the script polls
        # readiness itself so a failure names the service that did not come up.
        run: docker compose up -d db migrate lab api

      - name: File and resolve an incident
        run: ./scripts/compose-smoke.sh

      - name: Logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v
